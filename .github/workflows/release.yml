# Build Rigsmith for every platform and publish it as a GitHub release.
#
#   push a tag v*        build all three, publish a release named after the tag,
#                        and replace the rolling `latest` release with the same files
#   run it on a tag      the same, to re-cut a release (Run workflow, pick the tag)
#   run it on a branch   build all three, keep the files as workflow artifacts
#
# What a user downloads:
#
#   Rigsmith-x86_64.AppImage       Linux: chmod +x and run
#   Rigsmith-windows-x64.zip       Windows: portable folder, run rigsmith.exe
#   Rigsmith-macos-arm64.dmg       macOS 26+ on Apple Silicon: drag to Applications
#
# The names carry no version, so the newest tagged build is always at the same
#
#   https://github.com/tonis2/rigsmith/releases/download/latest/<file>
#
# e.g. .../download/latest/Rigsmith-windows-x64.zip. The `latest` tag is moved
# to the newest v* tag's commit and its release holds only that build. The
# version is in the app instead: the build is stamped with the tag
# (packaging/stamp-version.sh), and the Help menu shows it.
#
# The packaging itself lives in packaging/package-*.sh, so a release can be
# rebuilt locally the same way. Each bundle carries assets/ beside the
# executable, found by `locate_bundle` in src/main.c3 whatever directory the app
# is started from.
#
# Nothing renders on a runner (no GPU), so the check is that the packaged
# executable starts and prints its usage.
name: release

on:
  push:
    tags: ['v*']   # not `latest`: this workflow moves that tag itself
  workflow_dispatch:

permissions:
  contents: write

env:
  C3C_VERSION: v0.8.4

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26: the bundled KosmicKrisp driver is a macOS 26 binary anyway.
          - os: macos
            runner: macos-26
            c3c_asset: c3-macos.zip
          # The oldest supported Ubuntu, so the AppImage needs the oldest glibc.
          - os: linux
            runner: ubuntu-22.04
            c3c_asset: c3-linux-static.tar.gz
          - os: windows
            runner: windows-2022
            c3c_asset: c3-windows.zip

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true   # assets/**/*.glb live in Git LFS

      # .gitmodules names three.c3 by its SSH URL, which a runner has no key
      # for; the repository is public, so HTTPS needs none.
      - name: Submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --depth 1

      - name: Install c3c
        run: |
          set -euo pipefail
          url="https://github.com/c3lang/c3c/releases/download/${C3C_VERSION}/${{ matrix.c3c_asset }}"
          curl -fsSL -o c3c-dist "$url"
          mkdir -p "$HOME/c3c"
          case "${{ matrix.c3c_asset }}" in
            *.zip)     unzip -q c3c-dist -d "$HOME/c3c" ;;
            *.tar.gz)  tar -xzf c3c-dist -C "$HOME/c3c" ;;
          esac
          c3c_bin="$(find "$HOME/c3c" -type f \( -name c3c -o -name c3c.exe \) | head -1)"
          test -n "$c3c_bin" || { echo "no c3c in the archive"; find "$HOME/c3c" -maxdepth 2; exit 1; }
          chmod +x "$c3c_bin" || true
          echo "$(dirname "$c3c_bin")" >> "$GITHUB_PATH"
          rm c3c-dist

      - run: c3c --version

      # Submodules are already there; on macOS this fetches the Vulkan loader
      # and driver the .app carries. A no-op elsewhere.
      - name: Fetch the macOS Vulkan driver
        if: matrix.os == 'macos'
        run: ./libs/three/setup.sh driver

      # The tag's version into src/version.c3; a branch run gets a dev stamp.
      - name: Stamp the version
        run: |
          version="$(./packaging/stamp-version.sh)"
          echo "RIGSMITH_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: c3c build rigsmith --trust=full --safe=no -O3

      - name: Package
        run: ./packaging/package-${{ matrix.os }}.sh

      - name: Check the packaged app starts
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            macos)   exe=dist/macos/Rigsmith.app/Contents/MacOS/rigsmith ;;
            linux)   exe="$(ls dist/*.AppImage)"; export APPIMAGE_EXTRACT_AND_RUN=1 ;;
            windows) exe=dist/Rigsmith-windows-x64/rigsmith.exe ;;
          esac
          "$exe" --help > help.log 2>&1 || true
          cat help.log
          grep -q -- '--mcp' help.log || {
            echo "::error::the packaged rigsmith did not start"; exit 1; }
          grep -qF "Rigsmith ${RIGSMITH_VERSION} " help.log || {
            echo "::error::the packaged rigsmith does not report ${RIGSMITH_VERSION}"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: rigsmith-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Two tags pushed close together must not interleave on `latest`.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.zip
            dist/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Delete and recreate rather than edit: one step moves the tag to this
      # commit and drops any file this build no longer makes. --cleanup-tag
      # drops the old `latest` tag and create puts it back. The links are down
      # for the few seconds the upload takes.
      #
      # Two checks come before anything is deleted:
      #   - Only the newest v* tag moves `latest`. Re-cutting an older release
      #     leaves it where it is.
      #   - The workflow token may not create a tag on a commit whose
      #     .github/workflows differ from the default branch's: GitHub counts
      #     that as editing workflows, which this token never may (HTTP 403). A
      #     throwaway tag tries it first, so a refusal leaves the old `latest`
      #     standing rather than none. Nothing runs on that tag: tags this token
      #     makes start no workflows, and it isn't v* anyway.
      - name: Replace the rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          newest="$(gh api "repos/${GH_REPO}/tags" --paginate --jq '.[].name' | grep '^v[0-9]' | sort -V | tail -1)"
          if [ "$GITHUB_REF_NAME" != "$newest" ]; then
            echo "::notice::${GITHUB_REF_NAME} is not the newest tag (${newest}), so latest stays as it is"
            exit 0
          fi

          probe="refs/tags/latest-probe-${GITHUB_RUN_ID}"
          if ! gh api -X POST "repos/${GH_REPO}/git/refs" -f ref="$probe" -f sha="$GITHUB_SHA" > /dev/null; then
            echo "::error::GitHub won't let this workflow tag ${GITHUB_SHA::7}: its .github/workflows differ from the default branch's. Put the tag on a commit whose workflows match, such as the tip of main. The latest release is unchanged."
            exit 1
          fi
          gh api -X DELETE "repos/${GH_REPO}/git/${probe}" > /dev/null

          if gh release view latest > /dev/null 2>&1; then
            gh release delete latest --cleanup-tag --yes
          fi
          # A `latest` tag left without its release would pin create to the old commit.
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/latest" > /dev/null 2>&1 || true
          gh release create latest \
            dist/*.AppImage dist/*.zip dist/*.dmg \
            --target "$GITHUB_SHA" \
            --title "latest" \
            --latest=false \
            --notes "The newest build, Rigsmith ${version}"
