# Build Rigsmith for every platform and publish it as a GitHub release.
#
#   push a tag v*        build all three, publish a release named after the tag
#   run it by hand       build all three, keep the files as workflow artifacts
#
# What a user downloads:
#
#   Rigsmith-<v>-x86_64.AppImage       Linux: chmod +x and run
#   Rigsmith-<v>-windows-x64.zip       Windows: portable folder, run rigsmith.exe
#   Rigsmith-<v>-macos-arm64.dmg       macOS 26+ on Apple Silicon: drag to Applications
#
# The packaging itself lives in packaging/package-*.sh, so a release can be
# rebuilt locally the same way. Each bundle carries assets/ beside the
# executable, found by `locate_bundle` in src/main.c3 whatever directory the app
# is started from.
#
# Nothing renders on a runner (no GPU), so the check is that the packaged
# executable starts and prints its usage.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub release (tag builds do this anyway)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  C3C_VERSION: v0.8.4

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26: the bundled KosmicKrisp driver is a macOS 26 binary anyway.
          - os: macos
            runner: macos-26
            c3c_asset: c3-macos.zip
          # The oldest supported Ubuntu, so the AppImage needs the oldest glibc.
          - os: linux
            runner: ubuntu-22.04
            c3c_asset: c3-linux-static.tar.gz
          - os: windows
            runner: windows-2022
            c3c_asset: c3-windows.zip

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true   # assets/**/*.glb live in Git LFS

      # .gitmodules names three.c3 by its SSH URL, which a runner has no key
      # for; the repository is public, so HTTPS needs none.
      - name: Submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --depth 1

      - name: Install c3c
        run: |
          set -euo pipefail
          url="https://github.com/c3lang/c3c/releases/download/${C3C_VERSION}/${{ matrix.c3c_asset }}"
          curl -fsSL -o c3c-dist "$url"
          mkdir -p "$HOME/c3c"
          case "${{ matrix.c3c_asset }}" in
            *.zip)     unzip -q c3c-dist -d "$HOME/c3c" ;;
            *.tar.gz)  tar -xzf c3c-dist -C "$HOME/c3c" ;;
          esac
          c3c_bin="$(find "$HOME/c3c" -type f \( -name c3c -o -name c3c.exe \) | head -1)"
          test -n "$c3c_bin" || { echo "no c3c in the archive"; find "$HOME/c3c" -maxdepth 2; exit 1; }
          chmod +x "$c3c_bin" || true
          echo "$(dirname "$c3c_bin")" >> "$GITHUB_PATH"
          rm c3c-dist

      - run: c3c --version

      # Submodules are already there; on macOS this fetches the Vulkan loader
      # and driver the .app carries. A no-op elsewhere.
      - name: Fetch the macOS Vulkan driver
        if: matrix.os == 'macos'
        run: ./libs/three/setup.sh driver

      - name: Build
        run: c3c build rigsmith --trust=full --safe=no -O3

      - name: Package
        run: ./packaging/package-${{ matrix.os }}.sh

      - name: Check the packaged app starts
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            macos)   exe=dist/macos/Rigsmith.app/Contents/MacOS/rigsmith ;;
            linux)   exe="$(ls dist/*.AppImage)"; export APPIMAGE_EXTRACT_AND_RUN=1 ;;
            windows) exe="$(ls -d dist/Rigsmith-*-windows-x64)/rigsmith.exe" ;;
          esac
          "$exe" --help > help.log 2>&1 || true
          cat help.log
          grep -q -- '--mcp' help.log || {
            echo "::error::the packaged rigsmith did not start"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: rigsmith-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.zip
            dist/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
